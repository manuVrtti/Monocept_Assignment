<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments — InsurePolicy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="main-content">
      <header class="main-header">
        <div class="header-left">
          <button id="hamburgerBtn" class="hamburger-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div>
            <div class="header-title">Payment Management</div>
            <div class="header-subtitle">Track and process premium payments</div>
          </div>
        </div>
      </header>

      <div class="main-body">
        <!-- Page Header -->
        <div class="page-header">
          <div class="page-header-left">
            <h1 id="pageHeadingTitle">Payments</h1>
            <p id="pageHeadingSub">Review financial transactions and policy funding status</p>
          </div>
          <button class="btn btn-primary" onclick="openRecordPaymentModal()">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            Record Payment
          </button>
        </div>

        <!-- Filters -->
        <div class="filters-bar">
          <select class="filter-input" id="filterStatus" onchange="loadPayments()">
            <option value="">All Statuses</option>
            <option value="SUCCESS">Success</option>
            <option value="PENDING">Pending</option>
            <option value="FAILED">Failed</option>
          </select>
        </div>

        <!-- Table -->
        <div class="glass-card">
          <div class="table-container" id="tableContainer"></div>
          <div id="paginationContainer"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Record Payment Modal -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Record Premium Payment</div>
        <button class="modal-close" onclick="closeModal('paymentModal')">✕</button>
      </div>
      <form id="paymentForm" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="paymentPolicy">Policy Number</label>
            <select id="paymentPolicy" class="form-input" required>
              <option value="">Select a Policy</option>
            </select>
            <div class="form-error" id="paymentPolicyError"></div>
          </div>
          <div class="form-group">
            <label for="paymentAmount">Payment Amount (INR)</label>
            <input type="number" id="paymentAmount" class="form-input" placeholder="e.g. 5000" min="0.01" step="0.01" required>
            <div class="form-error" id="paymentAmountError"></div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <div class="form-group">
              <label for="paymentMode">Payment Mode</label>
              <select id="paymentMode" class="form-input" required>
                <option value="">Select Mode</option>
                <option value="UPI">UPI</option>
                <option value="CARD">Card</option>
                <option value="NET_BANKING">Net Banking</option>
                <option value="CASH">Cash</option>
              </select>
              <div class="form-error" id="paymentModeError"></div>
            </div>
            <div class="form-group">
              <label for="paymentStatus">Payment Status</label>
              <select id="paymentStatus" class="form-input" required>
                <option value="">Select Status</option>
                <option value="SUCCESS">Success</option>
                <option value="PENDING">Pending</option>
                <option value="FAILED">Failed</option>
              </select>
              <div class="form-error" id="paymentStatusError"></div>
            </div>
          </div>
          <div class="form-group">
            <label for="transactionRef">Transaction Reference / ID</label>
            <div style="display:flex; gap:8px;">
              <input type="text" id="transactionRef" class="form-input" placeholder="e.g. TXN123456" required>
              <button type="button" class="btn btn-secondary btn-sm" onclick="generateRandomTxnRef()">Gen</button>
            </div>
            <div class="form-error" id="transactionRefError"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('paymentModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="savePaymentBtn">Submit Payment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js?v=1"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/payments.js?v=1"></script>
</body>
</html>
