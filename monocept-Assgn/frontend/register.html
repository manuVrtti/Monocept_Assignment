<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — InsurePolicy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div style="width:56px;height:56px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:white;margin:0 auto 16px;">IP</div>
        <h1>InsurePolicy</h1>
        <p>Create your account</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="John Doe" required>
          <div class="form-error" id="fullNameError"></div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
          <div class="form-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Min 6 characters" required>
          <div class="form-error" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label for="mobileNumber">Mobile Number</label>
          <input type="tel" id="mobileNumber" class="form-input" placeholder="10-digit number" maxlength="10" required>
          <div class="form-error" id="mobileNumberError"></div>
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary btn-block btn-lg" style="margin-top:8px;">
          Create Account
        </button>
      </form>

      <p style="text-align:center;margin-top:24px;font-size:14px;color:var(--text-muted);">
        Already have an account? <a href="index.html" style="color:var(--accent-indigo);text-decoration:none;font-weight:500;">Sign in</a>
      </p>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');

    const fields = {
      fullName: document.getElementById('fullName'),
      email: document.getElementById('email'),
      password: document.getElementById('password'),
      mobileNumber: document.getElementById('mobileNumber'),
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAllErrors(form);

      let valid = true;

      if (!validateRequired(fields.fullName.value)) {
        showFieldError(fields.fullName, document.getElementById('fullNameError'), 'Full name is required');
        valid = false;
      }

      if (!validateRequired(fields.email.value)) {
        showFieldError(fields.email, document.getElementById('emailError'), 'Email is required');
        valid = false;
      } else if (!validateEmail(fields.email.value.trim())) {
        showFieldError(fields.email, document.getElementById('emailError'), 'Enter a valid email');
        valid = false;
      }

      if (!validateRequired(fields.password.value)) {
        showFieldError(fields.password, document.getElementById('passwordError'), 'Password is required');
        valid = false;
      } else if (fields.password.value.length < 6) {
        showFieldError(fields.password, document.getElementById('passwordError'), 'Password must be at least 6 characters');
        valid = false;
      }

      if (!validateRequired(fields.mobileNumber.value)) {
        showFieldError(fields.mobileNumber, document.getElementById('mobileNumberError'), 'Mobile number is required');
        valid = false;
      } else if (!validateMobile(fields.mobileNumber.value.trim())) {
        showFieldError(fields.mobileNumber, document.getElementById('mobileNumberError'), 'Enter a valid 10-digit mobile number');
        valid = false;
      }

      if (!valid) return;

      setButtonLoading(registerBtn, true);

      try {
        await apiRegister({
          fullName: fields.fullName.value.trim(),
          email: fields.email.value.trim(),
          password: fields.password.value,
          mobileNumber: fields.mobileNumber.value.trim(),
        });

        showToast('Account created successfully! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      } catch (err) {
        showToast(err.message || 'Registration failed. Please try again.', 'error');
        setButtonLoading(registerBtn, false);
      }
    });

    // Clear errors on input
    Object.entries(fields).forEach(([key, input]) => {
      input.addEventListener('input', () => clearFieldError(input, document.getElementById(`${key}Error`)));
    });
  </script>
</body>
</html>
