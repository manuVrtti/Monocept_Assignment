# ==============================
# Application Configuration
# ==============================
spring.application.name=insurance-management-system
server.port=8080

# ==============================
# MySQL Database Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/insurance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=@Suy3103
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT Configuration
# ==============================
jwt.secret=c4f8b2e1a9d7f3e6b0c5a8d2f1e4b7c0a3d6f9e2b5c8a1d4f7e0b3c6a9d2f5e8b1c4a7d0f3e6b9c2a5d8f1e4b7c0a3
jwt.expiration=86400000

# ==============================
# Logging Configuration
# ==============================
logging.level.com.insurance=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
